# Oberflächentexte / UI strings for the resource hub — fr.
#
# Ported from TOML to YAML when this repo adopted the kit module. One
# format across the organisation; the kit's i18n/ is YAML and carrying
# two parsers for one job is how a translation quietly stops being
# loaded.
#
# These 63 keys stay in this repo rather than moving into the kit. They
# belong to layouts only this repo has — resource-card, resource-listing,
# overview — and there is zero key overlap with the kit's course chrome.
# Promoting them would put a resource hub's vocabulary into eighteen
# language courses that have no such page.

