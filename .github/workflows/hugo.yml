name: Build and deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.159.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependencies
        run: pip install pyyaml jsonschema

      # ---- GATE 1: Schema validation -----------------------
      - name: Validate sources_master.yml schema
        run: python _scripts/validate_sources.py

      # ---- GATE 2: block commercial publishers -------------
      - name: Block commercial sources
        run: python _scripts/check_commercial.py

      # ---- GATE 2a: content frontmatter audit --------------
      - name: Audit content frontmatter
        run: python _scripts/audit_content.py

      # ---- Generate per-language overview JSON -------------
      - name: Generate overview data JSONs
        run: python _scripts/build_overview.py

      # ---- GATE 2b: validate /overview/ network JSON -------
      - name: Validate network data
        run: python _scripts/validate_network_data.py

      # ---- GATE 3: legal placeholders ----------------------
      # Expanded from <TODO / [PLACEHOLDER] to the broader DE-legal
      # set. Run on both source markdown and rendered HTML so we
      # catch both authoring drift and template drift.
      - name: Check legal placeholders (source)
        run: |
          set -e
          shopt -s globstar nullglob
          PATTERN='<TODO|\[PLACEHOLDER\]|\[NAME\]|\[ADDRESS\]|\[STUB\]|Lorem ipsum|XXXXXX'
          for f in content/de/imprint.md content/de/privacy.md content/de/disclaimer.md \
                   content/en/imprint.md content/en/privacy.md content/en/disclaimer.md \
                   content/fr/imprint.md content/fr/privacy.md content/fr/disclaimer.md; do
            [[ -f "$f" ]] || continue
            if grep -nEi "$PATTERN" "$f"; then
              echo "::error::$f contains placeholder markers."
              exit 1
            fi
          done

      # ---- GATE 4: copyright sentinel ----------------------
      - name: Check copyright in hugo.toml
        run: |
          if ! grep -q 'S. Le Boulanger' hugo.toml; then
            echo "::error::Copyright attribution to S. Le Boulanger missing in hugo.toml."
            exit 1
          fi

      # ---- GATE 5: Plausible head snippet present ----------
      - name: Check Plausible snippet
        run: |
          if ! grep -q 'data-domain="boulingua.github.io/ressources"' \
                 layouts/_partials/head/extensions.html; then
            echo "::error::Plausible data-domain missing or altered."
            exit 1
          fi

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Hugo's multilingual mode auto-writes a redirect at public/index.html
      # pointing at /de/. We want the trilingual language picker instead, so
      # overwrite with our hand-authored static/index.html after build.
      - name: Restore root language picker
        run: cp static/index.html public/index.html

      # ---- Post-build: confirm Plausible is in rendered HTML
      - name: Verify Plausible in rendered output
        run: |
          # Hugo's minifier may strip quotes from simple attribute values,
          # so accept both data-domain="..." and data-domain=... forms.
          if ! grep -rqE 'data-domain="?boulingua\.github\.io/ressources"?' public/; then
            echo "::error::Plausible data-domain missing from rendered output."
            exit 1
          fi
          if ! grep -rq 'analytics\.hellebo\.de/js/script\.file-downloads\.outbound-links\.js' public/; then
            echo "::error::Plausible script src missing from rendered output."
            exit 1
          fi

      # ---- Post-build: rendered HTML must not contain placeholders
      - name: Check legal placeholders (rendered)
        run: |
          set -e
          PATTERN='<TODO|\[PLACEHOLDER\]|\[NAME\]|\[ADDRESS\]|\[STUB\]|Lorem ipsum|XXXXXX'
          for f in public/de/imprint/index.html public/de/privacy/index.html public/de/disclaimer/index.html \
                   public/en/imprint/index.html public/en/privacy/index.html public/en/disclaimer/index.html \
                   public/fr/imprint/index.html public/fr/privacy/index.html public/fr/disclaimer/index.html; do
            [ -f "$f" ] || continue
            if grep -nEi "$PATTERN" "$f"; then
              echo "::error::$f contains placeholder markers (post-render)."
              exit 1
            fi
          done

      # ---- Post-build: every content page must carry author meta
      # The Coder theme renders <meta name="author"> from
      # hugo.toml params.author. Defence in depth: assert the tag is
      # actually present in every rendered page so a future theme
      # bump or template override can't silently drop attribution.
      - name: Verify author meta on every page
        run: |
          set -e
          # Skip taxonomy/paginator pages and Hugo-generated alias
          # redirects (they have <meta http-equiv=refresh> and aren't
          # content pages — the canonical target carries the meta).
          missing=()
          while IFS= read -r f; do
            grep -q 'http-equiv=refresh\|http-equiv="refresh"' "$f" && continue
            grep -q 'name=author content="S. Le Boulanger"\|name="author" content="S. Le Boulanger"' "$f" \
              || missing+=("$f")
          done < <(find public -name 'index.html' \
                     -not -path 'public/categories/*' \
                     -not -path 'public/tags/*' \
                     -not -path 'public/page/*' \
                     -not -path 'public/*/page/*')
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::pages missing author meta:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "OK — author meta present on every content page."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
