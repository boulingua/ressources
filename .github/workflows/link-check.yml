name: Link check

on:
  schedule:
    # Weekly, Monday 06:00 UTC. External resources rotate; we want a
    # nudge if British Council, BBC, DW, Goethe-Institut or TV5Monde
    # restructure a URL we link to.
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # used by lychee-action to open / update a tracking issue

defaults:
  run:
    shell: bash

jobs:
  link-check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.159.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        # Hugo Modules resolve the theme through the Go toolchain, so the
        # version has to come from go.mod — never a literal that can drift.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml jsonschema

      - name: Generate overview JSON
        run: python _scripts/build_overview.py

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Build with a ROOT baseURL (not the production /ressources/ one) so
      # Hugo emits internal links as /css/…, /<page>, /images/… — these
      # resolve against the built public/ tree via lychee's --root-dir.
      # The real GitHub Pages deploy (hugo.yml) keeps the production baseURL.
      - name: Build site
        run: hugo --minify --baseURL "/"

      - name: Restore root language picker
        run: cp static/index.html public/index.html

      # ── Internal link check (offline mode = no external requests).
      # Resolves every <a href> and <link href> against the local
      # public/ tree. Hard-fails on any broken internal link.
      - name: Lychee — internal links (blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path public/data/
            --root-dir ${{ github.workspace }}/public
            'public/**/*.html'
          fail: true
          format: detailed

      # ── External link check (full network). Advisory only —
      # external outages are not our problem to fail the build over,
      # but a fresh report every Monday lets the curator update
      # external URLs that have moved.
      - name: Lychee — external links (advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache --max-cache-age 7d
            --accept 200,206,429
            --exclude-path public/data/
            --include-fragments
            --root-dir ${{ github.workspace }}/public
            'public/**/*.html'
          fail: false
          format: detailed
          # opens / updates a single tracking issue with the diff
          # rather than spamming the queue every week.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── External resource URLs in the YAML database itself.
      # Every entry in data/sources_master.yml has a url; those don't
      # appear as <a href> in the rendered HTML (they're rendered into
      # the JS-driven /overview/ via JSON), so the lychee passes above
      # don't see them. Spot-check separately.
      - name: Check sources_master.yml URLs
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request, sys, yaml
          from pathlib import Path
          urls = []
          with Path("data/sources_master.yml").open(encoding="utf-8") as f:
              for r in yaml.safe_load(f) or []:
                  if isinstance(r, dict) and r.get("url"):
                      urls.append((r["id"], r["url"]))
          bad = []
          for rid, u in urls:
              try:
                  req = urllib.request.Request(u, method="HEAD",
                          headers={"User-Agent": "boulingua-link-check/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if resp.status >= 400:
                          bad.append((rid, u, f"HTTP {resp.status}"))
              except Exception as e:
                  bad.append((rid, u, str(e)))
          if bad:
              print("::warning::external resource URLs needing review:")
              for rid, u, why in bad:
                  print(f"  [{rid}] {u} — {why}")
          else:
              print(f"all {len(urls)} sources_master.yml URLs respond < 400.")
          PY
