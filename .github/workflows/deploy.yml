name: Rendern und deployen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Abhaengigkeiten
        run: pip install pyyaml jsonschema jupyter

      # ---- GATE 1: Schema-Validierung -----------------------
      - name: Schema-Validierung sources_master.yml
        run: python _scripts/validate_sources.py

      # ---- GATE 2: Kommerzielle Anbieter blockieren ---------
      - name: Kommerzielle Quellen pruefen
        run: python _scripts/check_commercial.py

      # ---- Mehrsprachige Content-Baeume generieren ----------
      - name: Sprachvarianten erzeugen
        run: python _scripts/build_pages.py

      # ---- Daten-JSON fuer Uebersicht/Graph generieren -----
      - name: Uebersichts-Daten erzeugen
        run: python _scripts/build_overview.py

      # ---- GATE 3: Placeholder-Check (alle Sprachen) --------
      - name: Impressum/Datenschutz Placeholder pruefen
        run: |
          if grep -rE '<TODO' de/imprint.qmd de/privacy.qmd \
                              en/imprint.qmd en/privacy.qmd \
                              fr/imprint.qmd fr/privacy.qmd; then
            echo "::error::Impressum oder Datenschutz enthaelt <TODO>-Marker."
            exit 1
          fi

      # ---- GATE 4: Copyright-Vermerk pruefen ----------------
      - name: Footer-Copyright pruefen
        run: |
          if ! grep -q 'S. Le Boulanger' _quarto.yml; then
            echo "::error::Copyright-Vermerk fuer S. Le Boulanger fehlt in _quarto.yml."
            exit 1
          fi

      # ---- Render -------------------------------------------
      - name: Quarto rendern
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
