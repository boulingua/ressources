      indexes at least ~87 Italian-language works (language:ita); the LibriVox
      catalogue itself lists more. Typical holdings span Dante, Collodi
      (Pinocchio), Manzoni, De Amicis, Verga and other public-domain classics.
      Volunteer-read, so recording quality varies. Authentic B1-C1 listening of
      literary Italian; pair the audio with the matching Wikisource/Gutenberg
      text. URL points to the reproducible Internet Archive query; the human
      catalogue lives at librivox.org.
  verified: 2026-07-22
  status: live

