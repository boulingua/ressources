      Asbjørnsen & Moe's Norwegian folktales (Norske Folkeeventyr), the 1814
      Constitution (Grunnlova) and other historical/legal documents. Register is
      19th/early-20th-century literary plus official/legal prose. Underlying
      works are public-domain; volunteer transcriptions and the platform are CC-
      BY-SA. Historical orthography (pre-1938 / Riksmål-era spelling) is common,
      so pair with reading strategies at B2+.
