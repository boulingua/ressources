- id: ar-wikisource
  language: ar
  variant: "Classical / Modern Standard Arabic (fuṣḥā)"
  category: literature-public-domain
  name: "Arabic Wikisource (ويكي مصدر)"
  publisher: "Wikimedia Foundation"
  url: https://ar.wikisource.org/
  medium: [text]
  transcript: n/a
  cefr_estimate: [B2, C1, C2]
  cefr_source: curator-estimate
  update_frequency: continuous
  archive_depth: deep
  access: free
  licence: public-domain
  editorial_independence: community
  sensitivity: historical-context
  topic_tags: [literature, poetry, classical-prose, religion, history, public-domain]
  pedagogical_notes: >
      Large, live edition: 94,020 content texts / 289,166 total pages / 4,024
      files / 613,643 edits / 72,511 registered users / 60 active users
      (Special:Statistics, 2026-07-22). The canonical free library of public-
      domain Arabic heritage. Holdings span the Qur'an and Qur'anic sciences,
      hadith collections, classical poetry (ديوان المتنبي al-Mutanabbi, Abu
      Nuwas, Ahmed Shawqi أحمد شوقي), classical prose (al-Jahiz, Ibn Khaldun's
      مقدمة ابن خلدون, كليلة ودمنة Kalila wa-Dimna, ألف ليلة وليلة One Thousand
      and One Nights), and modern public-domain authors (جبران خليل جبران
      Gibran, المنفلوطي al-Manfaluti, الكواكبي al-Kawakibi). Language is fuṣḥā,
      often archaic/Classical, so it lands at B2–C2; best used as short
      annotated excerpts with reading-strategy scaffolding.
      sensitivity=historical-context: period religious, political and social
      texts carry the prejudices of their era.
  verified: 2026-07-22
  status: live

