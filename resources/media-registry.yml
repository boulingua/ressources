# =====================================================================
# Boulingua — Multilingual Media Source Registry
# Authentic media sources across all target languages, curated as a
# content pool for later course population. Catalogue only — not a bulk
# download. Companion layer to data/sources_master.yml (didactic) and
# resources/registry.yml (acquisition). Where an entry corresponds to an
# item in the acquisition layer, acquisition_ref links it; archived: true
# means an open copy is cached under resources/_downloads/ (archive_paths).
#
# category  news-standard, news-simplified, radio-live, podcast, video-documentary, video-drama
#           music, literature-public-domain, literature-graded, print-press, children-youth, transcript-corpus
# access    free | free-registration | paid
# editorial_independence  public-service | private-independent |
#                         state-controlled | community | academic
# sensitivity  none | news-general | historical-context | religious
# status    live | redirect | dead | paywalled | protected
# =====================================================================

