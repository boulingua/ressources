# =====================================================================
#  boulingua/ressources — resource ACQUISITION manifest (registry.yml)
# ---------------------------------------------------------------------
#  Machine-readable layer on top of data/sources_master.yml. Each entry
#  records how a source is acquired and whether its material may be
#  redistributed. The bulk artefacts live in resources/_downloads/
#  (gitignored, local study cache); this manifest is the committed,
#  reproducible record. Rebuild the cache with scripts/refresh-resources.sh.
#
#  licence           : all-rights-reserved | public-domain | CC-*  | open-access | paid
#  access            : free | free-registration | paid | mixed
#  redistributable   : true only under a clear open licence
#  method            : static (direct files) | chrome (JS/login wall) | link-only | none (paid)
#  curated_ref       : id in data/sources_master.yml (single curation source of truth)
#  verification      : curated | fetched | knowledge | unverified
#  downloads         : concrete, hash-pinned files (open licences only; fetched by refresh script)
#
#  Generated 2026-07-22. Do not hand-edit acquisition fields; re-run the build.
# =====================================================================

