- id: "dw-nicos-weg"
  title: "Nicos Weg"
  publisher: "Deutsche Welle"
  url: "https://learngerman.dw.com/de/nicos-weg/c-36519687"
  language: "DE"
  license_type: "OE"
  license_details: >
    Öffentlich-rechtlich bereitgestellt von der Deutschen Welle.
    Frei zugänglich, Vollurheberrecht bei der DW.
  cefr_levels: ["A1", "A2", "B1"]
  skills: ["hoeren", "lesen", "grammatik", "wortschatz", "landeskunde"]
  media_types: ["video", "interaktiv"]
  description: >
    Telenovela-artiger Deutschkurs in 230 Folgen, eingebettet in
    interaktive Übungen und Grammatikerklärungen. Komplette
    Abdeckung der Niveaus A1 bis B1.
  description_en: >
    Telenovela-style German course in 230 episodes, embedded in
    interactive exercises and grammar explanations. Full coverage of
    levels A1 to B1.
  description_fr: >
    Cours d'allemand au format telenovela en 230 épisodes, intégré
    à des exercices interactifs et des explications grammaticales.
    Couverture complète des niveaux A1 à B1.
  applicable_units: ["daf_a1", "daf_a2", "daf_b1"]
  curator_notes: >
    Eine der hochwertigsten freien Ressourcen für DaF. Die Geschichte
