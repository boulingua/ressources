  publisher: "British Council"
  url: "https://learnenglishteens.britishcouncil.org/"
  language: "EN"
  license_type: "OE"
  license_details: >
    Frei zugänglich, institutionell bereitgestellt vom British Council.
    Vollurheberrecht beim British Council. Verlinkbar, nicht kopierbar.
  cefr_levels: ["A1", "A2", "B1", "B2"]
  skills: ["hoeren", "lesen", "grammatik", "wortschatz"]
  media_types: ["video", "interaktiv", "text"]
  description: >
    Umfangreiche Plattform mit Videos, Lese- und Hörtexten, Grammatik-
    Übungen und Vokabeltrainern für die Altersgruppe 13–17. Qualitativ
    hochwertig und didaktisch aufbereitet.
  description_en: >
    Broad platform with videos, reading and listening texts, grammar
    exercises and vocabulary trainers for ages 13–17. High editorial
