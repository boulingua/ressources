- id: "deutschakademie-grammatiktrainer"
  title: "DeutschAkademie – Online-Deutschkurs & Grammatiktrainer"
  publisher: "DeutschAkademie"
  url: "https://www.deutschakademie.de/online-deutschkurs/"
  language: "DE"
  license_type: "OE"
  license_details: >
    Frei und ohne Bezahlschranke nutzbar; die kostenlosen Online-Übungen
    und der Grammatiktrainer werden von der DeutschAkademie
