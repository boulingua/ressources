  cefr_levels: ["A1", "A2", "B1", "B2", "C1"]
  skills: ["grammatik", "wortschatz"]
  media_types: ["interaktiv", "text"]
  description: >
    Kostenloser Online-Grammatiktrainer mit über 25.000 interaktiven
    Übungen, sortiert nach Niveau (A1–C1) und nach über 150
    Grammatikthemen. Sofortige Auswertung und Erklärungen machen ihn
