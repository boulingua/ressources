  curator_notes_en: >
    Works well as a differentiation and homework pool: individual topics
    (e.g. two-way prepositions) can be assigned in a targeted way. Well
    suited for self-directed work or cover lessons on a tablet.
  curator_notes_fr: >
    Convient bien comme réservoir de différenciation et de devoirs : on
    peut assigner des thèmes précis (p. ex. les prépositions mixtes).
    Utilisable en travail autonome ou en heures de remplacement sur
    tablette.
