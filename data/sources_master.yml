  curator_notes: >
    Ideal für den bilingualen oder Geschichts-/Politik-Unterricht: z. B.
    Originalreden (Lincoln, King) als Lesequelle. Die geprüften
    Volltexte lassen sich gut in kürzere Abschnitte für Textarbeit
    gliedern.
  curator_notes_en: >
    Ideal for CLIL or history/politics lessons: e.g. original speeches
    (Lincoln, King) as reading sources. The proofread full texts split
    well into shorter passages for text work.
  curator_notes_fr: >
    Idéal pour l'enseignement bilingue ou d'histoire/politique : par ex.
    des discours originaux (Lincoln, King) comme sources de lecture. Les
    textes intégraux relus se découpent bien en passages plus courts.
  target_age: "15-99"
  last_checked: "2026-07-21"

- id: "wikisource-de"
  title: "Deutsches Wikisource — Quellensammlung"
  publisher: "Wikimedia Foundation"
  url: "https://de.wikisource.org/wiki/Hauptseite"
  language: "DE"
  license_type: "PD"
  license_details: >
    Kostenlos und ohne Anmeldung. Die enthaltenen Quellentexte sind
    gemeinfrei bzw. frei lizenziert; die redaktionelle Aufbereitung der
    Wiki-Seiten steht unter CC BY-SA. Wir verlinken nur und formulieren
    eigene Annotationen.
  cefr_levels: ["B1", "B2", "C1"]
  skills: ["lesen", "landeskunde", "wortschatz"]
  media_types: ["text"]
  description: >
    Das deutschsprachige Wikisource sammelt rund 57.000 gemeinfreie bzw.
    frei lizenzierte Texte: Gedichte, Märchen, Rechtstexte, historische
    Dokumente und Zeitschriften, jeweils mit geprüftem Bezug zum Scan
    der Quelle. Die Werke sind exportierbar und für DaF-Landeskunde und
    historische Textarbeit geeignet.
  description_en: >
    German Wikisource collects around 57,000 public-domain or freely
    licensed texts: poems, fairy tales, legal texts, historical
    documents and periodicals, each verified against a scan of the
    source. Works are exportable and suited to German-as-a-foreign-
    language Landeskunde and historical text work.
  description_fr: >
    Le Wikisource germanophone rassemble environ 57 000 textes du
    domaine public ou sous licence libre : poèmes, contes, textes
    juridiques, documents historiques et revues, chacun vérifié par
    rapport au scan de la source. Les œuvres sont exportables et
    conviennent à la civilisation et au travail sur textes historiques
    en allemand langue étrangère.
  applicable_units: ["daf_b1", "daf_b2"]
  curator_notes: >
    Nutzen Sie Grimms Märchen oder kurze Gedichte für DaF ab B1,
    historische Dokumente für Projektarbeit ab B2. Der geprüfte Volltext
    neben dem Faksimile schult zugleich das Lesen historischer Schrift.
  curator_notes_en: >
    Use Grimms' fairy tales or short poems for German learners from B1,
    historical documents for project work from B2. The proofread full
    text beside the facsimile also trains reading of historical
    typography.
  curator_notes_fr: >
    Utilisez les contes de Grimm ou de courts poèmes dès B1, des
    documents historiques pour des projets dès B2. Le texte intégral
    relu à côté du fac-similé entraîne aussi la lecture de la
    typographie ancienne.
  target_age: "14-99"
  last_checked: "2026-07-21"

- id: "tatoeba-en"
  title: "Tatoeba — Beispielsätze mit Übersetzungen"
  publisher: "Tatoeba"
  url: "https://tatoeba.org/en/"
  language: "EN"
  license_type: "CC"
  license_url: "https://creativecommons.org/licenses/by/2.0/fr/"
  license_details: >
    Kostenlos und ohne Anmeldung nutzbar. Die Sätze stehen unter
    Creative Commons CC BY 2.0 FR (Audioaufnahmen teils unter anderen
    CC-Lizenzen); bei Wiederverwendung Tatoeba als Quelle nennen.
  cefr_levels: ["A1", "A2", "B1", "B2"]
  skills: ["wortschatz", "grammatik", "lesen"]
  media_types: ["text", "interaktiv"]
  description: >
    Tatoeba ist eine offene, gemeinschaftliche Sammlung von über 13
    Millionen Beispielsätzen in mehr als 400 Sprachen, jeweils mit
    Übersetzungen und teils vertont. Man kann englische Sätze samt
    deutschen und französischen Entsprechungen suchen und so Wortschatz
    und Grammatik im Kontext erschließen. Die Daten stehen unter
    Creative Commons und lassen sich frei weiterverwenden.
  description_en: >
    Tatoeba is an open, collaborative collection of over 13 million
    example sentences in more than 400 languages, each with translations
    and some with audio. You can search English sentences alongside
    German and French equivalents to explore vocabulary and grammar in
    context. The data is Creative Commons licensed and freely reusable.
  description_fr: >
    Tatoeba est une collection ouverte et collaborative de plus de 13
    millions de phrases d'exemple dans plus de 400 langues, chacune
    traduite et parfois enregistrée. On peut rechercher des phrases
    anglaises avec leurs équivalents allemands et français pour explorer
    vocabulaire et grammaire en contexte. Les données sont sous licence
    Creative Commons et librement réutilisables.
  applicable_units: ["efl_kl9", "efl_kl10"]
  curator_notes: >
    Erstellen Sie aus der Sprachpaar-Suche schnell eigene Satzlisten für
    Übersetzungs- oder Strukturübungen. Weil die Sätze CC-BY lizenziert
    sind, dürfen sie mit Quellenangabe in Arbeitsblätter übernommen
    werden.
  curator_notes_en: >
    Use the language-pair search to quickly build your own sentence
    lists for translation or structure drills. As the sentences are CC-
    BY licensed, they may be reused in worksheets with attribution.
  curator_notes_fr: >
    Utilisez la recherche par paire de langues pour constituer
    rapidement vos listes de phrases pour la traduction ou les exercices
    de structure. Les phrases étant sous licence CC-BY, elles peuvent
    être reprises dans des fiches avec mention de la source.
  target_age: "13-99"
  last_checked: "2026-07-21"

- id: "librivox-en"
  title: "LibriVox — Kostenlose Hörbücher (Internet Archive)"
  publisher: "LibriVox"
  url: "https://archive.org/details/librivoxaudio"
  language: "EN"
  license_type: "PD"
  license_details: >
    Kostenlos, ohne Anmeldung, dauerhaft gehostet im Internet Archive.
    Texte und Sprachaufnahmen sind gemeinfrei (Public Domain, von
    LibriVox weltweit freigegeben). Wir verlinken nur.
  cefr_levels: ["B1", "B2", "C1"]
  skills: ["hoeren"]
  media_types: ["audio"]
  description: >
    LibriVox ist ein Freiwilligenprojekt, das gemeinfreie Bücher als
    kostenlose Hörbücher einliest; die Aufnahmen werden dauerhaft im
    Internet Archive gehostet und sind dort durchsuchbar. Die
    englischsprachige Sammlung umfasst tausende Titel von Klassikern bis
    zu Kurzgeschichten, streambar oder als MP3 herunterladbar. Sowohl
    die Texte als auch die Aufnahmen sind gemeinfrei.
  description_en: >
    LibriVox is a volunteer project that records public-domain books as
    free audiobooks; the recordings are permanently hosted and
    searchable on the Internet Archive. Its English collection spans
    thousands of titles from classics to short stories, streamable or
    downloadable as MP3. Both the texts and the recordings are in the
    public domain.
  description_fr: >
    LibriVox est un projet bénévole qui enregistre des livres du domaine
    public en livres audio gratuits ; les enregistrements sont hébergés
    durablement et consultables sur Internet Archive. Sa collection
    anglaise compte des milliers de titres, des classiques aux
    nouvelles, en streaming ou téléchargeables en MP3. Textes et
    enregistrements sont dans le domaine public.
  applicable_units: ["efl_kl9", "efl_kl10"]
  curator_notes: >
    Kombinieren Sie eine LibriVox-Aufnahme mit dem passenden Project-
    Gutenberg-Text für paralleles Hören und Lesen (Hörverstehen +
    Aussprache). Kurze Kapitel eignen sich als Hausaufgabe mit
    anschließendem Nacherzählen im Unterricht.
  curator_notes_en: >
    Pair a LibriVox recording with the matching Project Gutenberg text
    for parallel listening and reading (listening comprehension +
    pronunciation). Short chapters work as homework followed by
    retelling in class.
  curator_notes_fr: >
    Associez un enregistrement LibriVox au texte Project Gutenberg
    correspondant pour écouter et lire en parallèle (compréhension orale
    + prononciation). De courts chapitres conviennent en devoir suivi
    d'un récit en classe.
  target_age: "13-99"
  last_checked: "2026-07-21"

- id: "commons-de-aussprache"
  title: "Wikimedia Commons — Deutsche Aussprache-Audios"
  publisher: "Wikimedia Commons"
  url: "https://commons.wikimedia.org/wiki/Category:German_pronunciation"
  language: "DE"
  license_type: "CC"
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  license_details: >
    Kostenlos und ohne Anmeldung. Die Dateien stehen unter freien
    Lizenzen (überwiegend CC BY-SA 4.0, teils CC0/gemeinfrei); die
    genaue Lizenz je Datei auf der Beschreibungsseite prüfen und bei
    Wiederverwendung nennen.
  cefr_levels: ["A1", "A2", "B1"]
  skills: ["hoeren", "wortschatz", "sprechen"]
  media_types: ["audio"]
  description: >
    Diese Kategorie auf Wikimedia Commons bündelt zehntausende
    Audioaufnahmen deutscher Wörter, gesprochen von Muttersprachlern (v.
    a. aus den Projekten Lingua Libre und Shtooka). Jede Datei lässt
    sich einzeln anhören und herunterladen; regionale Varianten (z. B.
    österreichisches Deutsch) sind ausgewiesen. Ideal als Aussprache-
    und Wortschatz-Referenz.
  description_en: >
    This Wikimedia Commons category gathers tens of thousands of audio
    recordings of German words spoken by native speakers (mainly from
    the Lingua Libre and Shtooka projects). Each file can be played and
    downloaded individually; regional variants (e.g. Austrian German)
    are marked. Ideal as a pronunciation and vocabulary reference.
  description_fr: >
    Cette catégorie de Wikimedia Commons rassemble des dizaines de
    milliers d'enregistrements audio de mots allemands prononcés par des
    locuteurs natifs (surtout des projets Lingua Libre et Shtooka).
    Chaque fichier s'écoute et se télécharge individuellement ; les
    variantes régionales (ex. allemand autrichien) sont signalées. Idéal
    comme référence de prononciation et de vocabulaire.
  applicable_units: ["daf_a1", "daf_a2"]
  curator_notes: >
    Verlinken Sie einzelne Audiodateien direkt aus Vokabellisten, damit
    DaF-Lernende die korrekte Aussprache selbstständig prüfen. Für
    Minimalpaar-Übungen lassen sich gezielt ähnlich klingende Wörter
    zusammenstellen.
  curator_notes_en: >
    Link individual audio files straight from vocabulary lists so
    learners of German can check correct pronunciation independently.
    For minimal-pair exercises, assemble similar-sounding words on
    purpose.
  curator_notes_fr: >
    Reliez des fichiers audio individuels directement depuis des listes
    de vocabulaire pour que les apprenants d'allemand vérifient seuls la
    prononciation. Pour des exercices de paires minimales, regroupez des
    mots proches à dessein.
  target_age: "13-99"
  last_checked: "2026-07-21"

- id: "commons-fr-prononciation"
  title: "Wikimedia Commons — Französische Aussprache-Audios"
  publisher: "Wikimedia Commons"
  url: "https://commons.wikimedia.org/wiki/Category:French_pronunciation"
  language: "FR"
  license_type: "CC"
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  license_details: >
    Kostenlos und ohne Anmeldung. Die Dateien stehen unter freien
    Lizenzen (überwiegend CC BY-SA 4.0, teils CC0/gemeinfrei); die
    genaue Lizenz je Datei auf der Beschreibungsseite prüfen und bei
    Wiederverwendung nennen.
  cefr_levels: ["A1", "A2", "B1"]
  skills: ["hoeren", "wortschatz", "sprechen"]
  media_types: ["audio"]
  description: >
    Diese Commons-Kategorie enthält über 400.000 Aussprache-Aufnahmen
    französischer Wörter, Zahlen, Wochentage und Ortsnamen von
    Muttersprachlern (überwiegend Lingua Libre). Die Audios decken
    verschiedene Akzente und Regionen ab und sind einzeln abspielbar
    sowie herunterladbar. Eine umfangreiche, freie Aussprache-Referenz
    für den Französischunterricht.
  description_en: >
    This Commons category holds over 400,000 pronunciation recordings of
    French words, numbers, weekdays and place names by native speakers
    (mostly Lingua Libre). The audio covers various accents and regions
    and can be played and downloaded individually. An extensive, free
    pronunciation reference for French lessons.
  description_fr: >
    Cette catégorie Commons contient plus de 400 000 enregistrements de
    prononciation de mots, nombres, jours et noms de lieux français par
    des locuteurs natifs (surtout Lingua Libre). Les audios couvrent
    divers accents et régions et s'écoutent et se téléchargent
    individuellement. Une vaste référence de prononciation libre pour le
    cours de français.
  applicable_units: ["fle_kl7", "fle_kl8"]
  curator_notes: >
    Nutzen Sie die Aufnahmen, um Liaison und Nasalvokale hörbar zu
    machen; einzelne Dateien lassen sich in digitale Vokabelkarten
    einbinden. Vergleichen Sie mehrere Sprecher, um Aussprachevarianten
    bewusst zu machen.
  curator_notes_en: >
    Use the recordings to make liaison and nasal vowels audible;
    individual files embed into digital flashcards. Compare several
    speakers to raise awareness of pronunciation variation.
  curator_notes_fr: >
    Utilisez les enregistrements pour rendre audibles la liaison et les
    voyelles nasales ; les fichiers s'intègrent à des cartes de
    vocabulaire numériques. Comparez plusieurs locuteurs pour
    sensibiliser aux variantes de prononciation.
  target_age: "12-99"
  last_checked: "2026-07-21"

- id: "commons-en-pronunciation"
  title: "Wikimedia Commons — Englische Aussprache-Audios"
  publisher: "Wikimedia Commons"
  url: "https://commons.wikimedia.org/wiki/Category:English_pronunciation"
  language: "EN"
  license_type: "CC"
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  license_details: >
    Kostenlos und ohne Anmeldung. Die Dateien stehen unter freien
    Lizenzen (überwiegend CC BY-SA 4.0, teils CC0/gemeinfrei); die
    genaue Lizenz je Datei auf der Beschreibungsseite prüfen und bei
    Wiederverwendung nennen.
  cefr_levels: ["A1", "A2", "B1"]
  skills: ["hoeren", "wortschatz", "sprechen"]
  media_types: ["audio"]
  description: >
    Diese Commons-Kategorie sammelt über 100.000 Aussprache-Aufnahmen
    englischer Wörter von Muttersprachlern (v. a. Lingua Libre, Shtooka)
    samt Dialektvarianten. Die Dateien sind alphabetisch geordnet,
    einzeln anhörbar und herunterladbar und dienen u. a. als
    Aussprachereferenz für Wiktionary. Eine freie, verlässliche Quelle
    für Aussprache- und Wortschatzarbeit.
  description_en: >
    This Commons category collects over 100,000 pronunciation recordings
    of English words by native speakers (mainly Lingua Libre, Shtooka),
    including dialect variants. Files are ordered alphabetically,
    individually playable and downloadable, and serve as a pronunciation
    reference for Wiktionary among others. A free, reliable source for
    pronunciation and vocabulary work.
  description_fr: >
    Cette catégorie Commons réunit plus de 100 000 enregistrements de
    prononciation de mots anglais par des locuteurs natifs (surtout
    Lingua Libre, Shtooka), variantes dialectales comprises. Les
    fichiers sont classés alphabétiquement, écoutables et
    téléchargeables individuellement, et servent notamment de référence
    de prononciation pour Wiktionary. Une source libre et fiable pour la
    prononciation et le vocabulaire.
  applicable_units: ["efl_kl5", "efl_kl6"]
  curator_notes: >
    Bauen Sie die Audios in digitale Vokabeltrainer ein, damit Lernende
    britische und amerikanische Varianten vergleichen können. Gut
    geeignet für eigenständiges Aussprachetraining und Minimalpaar-
    Übungen.
  curator_notes_en: >
    Embed the audio in digital vocabulary trainers so learners can
    compare British and American variants. Well suited to independent
    pronunciation practice and minimal-pair exercises.
  curator_notes_fr: >
    Intégrez les audios dans des entraîneurs de vocabulaire numériques
    pour comparer les variantes britannique et américaine. Bien adapté à
    l'entraînement autonome de la prononciation et aux paires minimales.
  target_age: "10-99"
  last_checked: "2026-07-21"
