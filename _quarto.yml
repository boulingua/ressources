project:
  type: website
  output-dir: _site
  pre-render:
    - python _scripts/build_pages.py
    - python _scripts/build_overview.py
  render:
    - "index.qmd"
    - "de/**/*.qmd"
    - "en/**/*.qmd"
    - "fr/**/*.qmd"
  resources:
    - "assets/"

website:
  title: "#ressources"
  description: >
    Kuratierte Sammlung frei verfügbarer Unterrichtsressourcen
    für Englisch, Französisch und Deutsch als Fremdsprache.
  site-url: "https://boulingua.github.io/ressources/"
  repo-url: "https://github.com/boulingua/ressources"
  navbar:
    title: "#ressources"
    logo: false
    left:
      - text: "DE"
        href: de/index.qmd
      - text: "EN"
        href: en/index.qmd
      - text: "FR"
        href: fr/index.qmd
    right:
      - text: "About · À propos"
        menu:
          - text: "Über (DE)"
            href: de/about.qmd
          - text: "About (EN)"
            href: en/about.qmd
          - text: "À propos (FR)"
            href: fr/about.qmd
      - text: "Rechtliches · Legal · Mentions"
        menu:
          - text: "Impressum (DE)"
            href: de/imprint.qmd
          - text: "Imprint (EN)"
            href: en/imprint.qmd
          - text: "Mentions légales (FR)"
            href: fr/imprint.qmd
          - text: "---"
          - text: "Datenschutz (DE)"
            href: de/privacy.qmd
          - text: "Privacy (EN)"
            href: en/privacy.qmd
          - text: "Confidentialité (FR)"
            href: fr/privacy.qmd
          - text: "---"
          - text: "Haftungsausschluss (DE)"
            href: de/disclaimer.qmd
          - text: "Disclaimer (EN)"
            href: en/disclaimer.qmd
          - text: "Avis (FR)"
            href: fr/disclaimer.qmd
    tools:
      - icon: github
        href: https://github.com/boulingua/ressources
        text: "GitHub"
  page-footer:
    center: |
      © S. Le Boulanger · Code: MIT · Inhalte / Content / Contenus: CC-BY-SA 4.0 ·
      [Impressum](/de/imprint.qmd) ·
      [Datenschutz](/de/privacy.qmd) ·
      [Haftungsausschluss](/de/disclaimer.qmd) ·
      [Kontakt](mailto:277736839+s-leboulanger@users.noreply.github.com)

format:
  html:
    theme:
      light: [flatly, assets/light.scss]
      dark: [darkly, assets/dark.scss]
    toc: true
    code-tools: false
    link-external-newwindow: false
    include-in-header: _includes/in-header.html
    include-after-body: _includes/after-body.html

filters:
  - _scripts/vgwort.lua
